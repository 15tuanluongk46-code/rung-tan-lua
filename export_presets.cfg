[preset.0]
name="Linux"
platform="Linux"
runnable=true
export_filter="all_resources"
include_filter="LICENSE,assets/fonts/*LICENSE*,assets/CREDITS.md,assets/world_routes.json,assets/action_spec.json,assets/player_motion/timelines.json"
exclude_filter="build/*,docs/*,tools/*,tests/*,assets/source_props/*,*.py"
export_path="build/linux/RungTanLua.x86_64"
script_export_mode=2

[preset.0.options]
custom_template/debug="build/templates/linux_debug.x86_64"
custom_template/release="build/templates/linux_release.x86_64"
binary_format/architecture="x86_64"
binary_format/embed_pck=true
debug/export_console_wrapper=0

[preset.1]
name="Windows"
platform="Windows Desktop"
runnable=true
export_filter="all_resources"
include_filter="LICENSE,assets/fonts/*LICENSE*,assets/CREDITS.md,assets/world_routes.json,assets/action_spec.json,assets/player_motion/timelines.json"
exclude_filter="build/*,docs/*,tools/*,tests/*,assets/source_props/*,*.py"
export_path="build/windows/RungTanLua.exe"
